<svg xmlns='http://www.w3.org/2000/svg' width='1060' height='790' viewBox='0 0 1060 790'><title>安装助手 · WPF 布局设计预览（不是屏幕截图）</title><rect width='100%' height='100%' fill='#F4F6FA'/><rect x='0' y='0' width='206' height='753.714' rx='0' fill='#122944' stroke='none' stroke-width='0'/><text x='24' y='47' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='17' font-weight='700' fill='#FFFFFF'>ONEXPLAYER</text><text x='24' y='73.59' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#B4C6DC'>SteamOS 安装助手</text><text x='24' y='123.37' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>01   安装位置</text><text x='24' y='166.15' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='700' fill='#FFFFFF'>02   准备系统</text><text x='24' y='208.93' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>03   确认方案</text><text x='24' y='251.71' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>04   安装进度</text><text x='24' y='294.49' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>05   完成</text><text x='24' y='670.474' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#BCD0E9'>开发预览 · 虚拟盘演练</text><rect x='24' y='685.714' width='162' height='44' rx='7' fill='#253F5F' stroke='none' stroke-width='2'/><text x='42' y='712.824' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#FFFFFF'>高级工具 ↗</text><text x='236' y='51' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='25' font-weight='600' fill='#192B43'>准备你的 SteamOS 系统</text><text x='236' y='79.75' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>选好镜像，后面的系统准备交给安装助手。</text><rect x='236' y='104.75' width='780.286' height='33.24' rx='8' fill='#E7EEF9' stroke='none' stroke-width='0'/><text x='248' y='125.75' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#35547A'>当前使用独立虚拟盘演练。掌机的实际磁盘安装将在实机验收阶段开放。</text><defs><clipPath id='clip0'><rect x='236' y='155.99' width='772.286' height='487.944'/></clipPath></defs><g clip-path='url(#clip0)'><rect x='236' y='155.99' width='772.286' height='235.13' rx='12' fill='#FFFFFF' stroke='#DFE6F0' stroke-width='1'/><text x='259' y='197.99' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='19' font-weight='600' fill='#192B43'>选择系统镜像</text><text x='259' y='227.12' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>使用本地 SteamOS 恢复镜像；准备过程在 Windows 中自动完成。</text><rect x='881.896' y='254.12' width='103.39' height='44' rx='7' fill='#E8EDF4' stroke='none' stroke-width='2'/><text x='899.896' y='281.23' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#17243A'>选择文件…</text><defs><clipPath id='clip1'><rect x='259' y='254.12' width='612.896' height='44'/></clipPath></defs><g clip-path='url(#clip1)'><text x='269' y='276.12' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#000000'>示例系统镜像.img</text><rect x='259' y='254.12' width='612.896' height='44' rx='0' fill='#FFFFFF' stroke='#D4DBE5' stroke-width='1'/><rect x='260' y='255.12' width='610.896' height='42' fill='none'/><defs><clipPath id='clip2'><rect x='270' y='263.12' width='590.896' height='26'/></clipPath></defs><g clip-path='url(#clip2)'></g></g><text x='259' y='318.12' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#61728A'>支持 .img、.img.bz2 和 .img.zip。系统版本以镜像内信息为准。</text><rect x='259' y='345.12' width='726.286' height='23' rx='3' fill='none' stroke='none' stroke-width='1'/><rect x='261' y='347.12' width='722.286' height='19' rx='0' fill='none' stroke='none' stroke-width='0'/><rect x='261' y='347.12' width='722.286' height='19' fill='none'/><text x='284' y='361.73' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#000000'>开发选项</text><rect x='236' y='405.12' width='772.286' height='136.13' rx='12' fill='#FFFFFF' stroke='#DFE6F0' stroke-width='1'/><text x='259' y='447.12' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='19' font-weight='600' fill='#192B43'>本次安装内容</text><text x='259' y='476.25' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>SteamOS 基础系统、A/B 系统分区、独立数据空间与启动文件。</text><text x='259' y='509.25' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>HDR、无线适配、功耗控制和插件将在对应系统版本与掌机兼容性验收后开放选择。</text></g><rect x='236' y='689.714' width='94' height='44' rx='7' fill='#E8EDF4' stroke='none' stroke-width='2'/><text x='262' y='716.824' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#17243A'>上一步</text><rect x='880.286' y='689.714' width='136' height='44' rx='7' fill='#2968D9' stroke='none' stroke-width='2'/><text x='927.286' y='716.824' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#FFFFFF'>下一步</text><text x='236' y='779' font-family='Microsoft YaHei,sans-serif' font-size='11' fill='#61728A'>设计预览 · 根据 WPF 布局重建，非原生窗口截图</text></svg>