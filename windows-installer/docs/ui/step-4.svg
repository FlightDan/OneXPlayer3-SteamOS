<svg xmlns='http://www.w3.org/2000/svg' width='1060' height='790' viewBox='0 0 1060 790'><title>安装助手 · WPF 布局设计预览（不是屏幕截图）</title><rect width='100%' height='100%' fill='#F4F6FA'/><rect x='0' y='0' width='206' height='753.714' rx='0' fill='#122944' stroke='none' stroke-width='0'/><text x='24' y='47' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='17' font-weight='700' fill='#FFFFFF'>ONEXPLAYER</text><text x='24' y='73.59' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#B4C6DC'>SteamOS 安装助手</text><text x='24' y='123.37' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>01   安装位置</text><text x='24' y='166.15' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>02   准备系统</text><text x='24' y='208.93' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>03   确认方案</text><text x='24' y='251.71' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>04   安装进度</text><text x='24' y='294.49' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='700' fill='#FFFFFF'>05   完成</text><text x='24' y='670.474' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#BCD0E9'>开发预览 · 虚拟盘演练</text><rect x='24' y='685.714' width='162' height='44' rx='7' fill='#253F5F' stroke='none' stroke-width='2'/><text x='42' y='712.824' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#FFFFFF'>高级工具 ↗</text><text x='236' y='51' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='25' font-weight='600' fill='#192B43'>本次演练结果</text><text x='236' y='79.75' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>查看已完成的步骤，以及下一步需要处理的事项。</text><rect x='236' y='104.75' width='780.286' height='33.24' rx='8' fill='#E7EEF9' stroke='none' stroke-width='0'/><text x='248' y='125.75' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#35547A'>当前使用独立虚拟盘演练。掌机的实际磁盘安装将在实机验收阶段开放。</text><defs><clipPath id='clip0'><rect x='236' y='155.99' width='772.286' height='487.944'/></clipPath></defs><g clip-path='url(#clip0)'><rect x='236' y='155.99' width='772.286' height='215.21' rx='12' fill='#FFFFFF' stroke='#DFE6F0' stroke-width='1'/><text x='259' y='201.99' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='23' font-weight='600' fill='#192B43'>界面预览 · 演练完成示例</text><text x='259' y='236.2' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>实际任务完成后，这里会显示分区写入与独立启动的验证结果。</text><text x='259' y='275.2' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>此页面仅用于界面检查，不代表已执行安装。</text><rect x='259' y='304.2' width='134' height='44' rx='7' fill='#E8EDF4' stroke='none' stroke-width='2'/><text x='277' y='331.31' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#17243A'>打开任务文件夹</text></g><rect x='880.286' y='689.714' width='136' height='44' rx='7' fill='#2968D9' stroke='none' stroke-width='2'/><text x='920.286' y='716.824' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#FFFFFF'>返回首页</text><text x='236' y='779' font-family='Microsoft YaHei,sans-serif' font-size='11' fill='#61728A'>设计预览 · 根据 WPF 布局重建，非原生窗口截图</text></svg>