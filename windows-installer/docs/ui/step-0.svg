<svg xmlns='http://www.w3.org/2000/svg' width='1060' height='790' viewBox='0 0 1060 790'><title>安装助手 · WPF 布局设计预览（不是屏幕截图）</title><rect width='100%' height='100%' fill='#F4F6FA'/><rect x='0' y='0' width='206' height='753.714' rx='0' fill='#122944' stroke='none' stroke-width='0'/><text x='24' y='47' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='17' font-weight='700' fill='#FFFFFF'>ONEXPLAYER</text><text x='24' y='73.59' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#B4C6DC'>SteamOS 安装助手</text><text x='24' y='123.37' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='700' fill='#FFFFFF'>01   安装位置</text><text x='24' y='166.15' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>02   准备系统</text><text x='24' y='208.93' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>03   确认方案</text><text x='24' y='251.71' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>04   安装进度</text><text x='24' y='294.49' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>05   完成</text><text x='24' y='670.474' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#BCD0E9'>开发预览 · 虚拟盘演练</text><rect x='24' y='685.714' width='162' height='44' rx='7' fill='#253F5F' stroke='none' stroke-width='2'/><text x='42' y='712.824' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#FFFFFF'>高级工具 ↗</text><text x='236' y='51' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='25' font-weight='600' fill='#192B43'>SteamOS，装在你选择的位置</text><text x='236' y='79.75' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>保留 Windows 双系统，或把完整系统装进外部设备。</text><rect x='236' y='104.75' width='780.286' height='33.24' rx='8' fill='#E7EEF9' stroke='none' stroke-width='0'/><text x='248' y='125.75' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#35547A'>当前使用独立虚拟盘演练。掌机的实际磁盘安装将在实机验收阶段开放。</text><defs><clipPath id='clip0'><rect x='236' y='155.99' width='772.286' height='487.944'/></clipPath></defs><g clip-path='url(#clip0)'><rect x='236' y='155.99' width='772.286' height='125.37' rx='10' fill='#FFFFFF' stroke='#DEE5EF' stroke-width='2'/><text x='258' y='196.99' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='19' font-weight='600' fill='#000000'>内置硬盘 · 与 Windows 共存</text><text x='258' y='226.12' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>为 SteamOS 分配独立空间，开机时选择要进入的系统。</text><text x='258' y='256.12' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#3867A2'>演练会保留测试盘上的已有分区与文件。</text><rect x='963.286' y='177.99' width='20' height='20' rx='10' fill='none' stroke='#B5C2D3' stroke-width='2'/><rect x='236' y='293.36' width='772.286' height='125.37' rx='10' fill='#EFF5FF' stroke='#2968D9' stroke-width='2'/><text x='258' y='334.36' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='19' font-weight='600' fill='#000000'>外部 SD 卡 / SSD · 完整 SteamOS</text><text x='258' y='363.49' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>系统和游戏都存放在外部设备，从该设备启动即可使用。</text><text x='258' y='393.49' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#3867A2'>实机安装会清空所选外部设备；演练仅创建新测试文件。</text><rect x='963.286' y='315.36' width='20' height='20' rx='10' fill='#2968D9' stroke='#2968D9' stroke-width='2'/><text x='236' y='444.73' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#61728A'>本轮演练容量为 80 GiB。真实设备的容量、现有分区和启动能力需在掌机上核对。</text><rect x='236' y='467.73' width='772.286' height='146.78' rx='12' fill='#FFFFFF' stroke='#DFE6F0' stroke-width='1'/><text x='259' y='504.73' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='600' fill='#192B43'>上次任务</text><text x='259' y='528.51' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>上次虚拟盘演练已完成。记录中保留了分区写入和启动验证结果。</text><rect x='259' y='547.51' width='120' height='44' rx='7' fill='#E8EDF4' stroke='none' stroke-width='2'/><text x='277' y='574.62' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#17243A'>查看任务记录</text></g><rect x='880.286' y='689.714' width='136' height='44' rx='7' fill='#2968D9' stroke='none' stroke-width='2'/><text x='927.286' y='716.824' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#FFFFFF'>下一步</text><text x='236' y='779' font-family='Microsoft YaHei,sans-serif' font-size='11' fill='#61728A'>设计预览 · 根据 WPF 布局重建，非原生窗口截图</text></svg>