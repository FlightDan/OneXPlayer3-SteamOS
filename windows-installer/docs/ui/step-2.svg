<svg xmlns='http://www.w3.org/2000/svg' width='1060' height='790' viewBox='0 0 1060 790'><title>安装助手 · WPF 布局设计预览（不是屏幕截图）</title><rect width='100%' height='100%' fill='#F4F6FA'/><rect x='0' y='0' width='206' height='753.714' rx='0' fill='#122944' stroke='none' stroke-width='0'/><text x='24' y='47' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='17' font-weight='700' fill='#FFFFFF'>ONEXPLAYER</text><text x='24' y='73.59' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#B4C6DC'>SteamOS 安装助手</text><text x='24' y='123.37' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>01   安装位置</text><text x='24' y='166.15' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>02   准备系统</text><text x='24' y='208.93' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='700' fill='#FFFFFF'>03   确认方案</text><text x='24' y='251.71' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>04   安装进度</text><text x='24' y='294.49' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>05   完成</text><text x='24' y='670.474' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#BCD0E9'>开发预览 · 虚拟盘演练</text><rect x='24' y='685.714' width='162' height='44' rx='7' fill='#253F5F' stroke='none' stroke-width='2'/><text x='42' y='712.824' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#FFFFFF'>高级工具 ↗</text><text x='236' y='51' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='25' font-weight='600' fill='#192B43'>开始前，核对这次方案</text><text x='236' y='79.75' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>只创建本工具自己的测试盘；所有结果都会记录。</text><rect x='236' y='104.75' width='780.286' height='33.24' rx='8' fill='#E7EEF9' stroke='none' stroke-width='0'/><text x='248' y='125.75' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#35547A'>当前使用独立虚拟盘演练。掌机的实际磁盘安装将在实机验收阶段开放。</text><defs><clipPath id='clip0'><rect x='236' y='155.99' width='772.286' height='487.944'/></clipPath></defs><g clip-path='url(#clip0)'><rect x='236' y='155.99' width='772.286' height='284.5' rx='12' fill='#FFFFFF' stroke='#DFE6F0' stroke-width='1'/><text x='259' y='197.99' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='19' font-weight='600' fill='#192B43'>本次演练方案</text><text x='259' y='234.12' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='17' font-weight='600' fill='#192B43'>外部完整系统方案 · 80 GiB 虚拟测试盘</text><text x='259' y='264.71' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>恢复镜像：示例系统镜像.img</text><rect x='259' y='289.71' width='726.286' height='1' rx='0' fill='#E2E8F1' stroke='none' stroke-width='0'/><text x='259' y='320.71' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>新建：仅包含 SteamOS 的启动分区、A/B 系统和独立数据空间。</text><text x='259' y='343.71' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>对应实机流程：所选 SD 卡 / SSD 的现有内容将被清空。</text><text x='259' y='382.71' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#315F9E'>01  准备系统 → 02  写入并核对 → 03  验证启动</text><text x='259' y='408.49' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>写入测试盘时会按需请求管理员权限。完成后显示启动验证结果，不会重启当前电脑。</text><rect x='236' y='454.49' width='772.286' height='148.78' rx='12' fill='#FFFFFF' stroke='#DFE6F0' stroke-width='1'/><text x='259' y='491.49' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='600' fill='#192B43'>工作空间</text><text x='259' y='517.27' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>工作目录：C:\steamosmod\windows-installer\work</text><text x='259' y='540.27' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>当前可用：371.4 GiB · 本轮需至少 160.5 GiB 可用空间。</text><text x='259' y='569.27' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#61728A'>测试文件和日志会保留，便于复查；失败后重新演练会创建新的测试盘。</text></g><rect x='236' y='689.714' width='94' height='44' rx='7' fill='#E8EDF4' stroke='none' stroke-width='2'/><text x='262' y='716.824' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#17243A'>上一步</text><rect x='880.286' y='689.714' width='136' height='44' rx='7' fill='#2968D9' stroke='none' stroke-width='2'/><text x='920.286' y='716.824' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#FFFFFF'>开始演练</text><text x='236' y='779' font-family='Microsoft YaHei,sans-serif' font-size='11' fill='#61728A'>设计预览 · 根据 WPF 布局重建，非原生窗口截图</text></svg>