<svg xmlns='http://www.w3.org/2000/svg' width='1060' height='790' viewBox='0 0 1060 790'><title>安装助手 · WPF 布局设计预览（不是屏幕截图）</title><rect width='100%' height='100%' fill='#F4F6FA'/><rect x='0' y='0' width='206' height='753.714' rx='0' fill='#122944' stroke='none' stroke-width='0'/><text x='24' y='47' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='17' font-weight='700' fill='#FFFFFF'>ONEXPLAYER</text><text x='24' y='73.59' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#B4C6DC'>SteamOS 安装助手</text><text x='24' y='123.37' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>01   安装位置</text><text x='24' y='166.15' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>02   准备系统</text><text x='24' y='208.93' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>03   确认方案</text><text x='24' y='251.71' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='700' fill='#FFFFFF'>04   安装进度</text><text x='24' y='294.49' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#94A9C3'>05   完成</text><text x='24' y='670.474' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#BCD0E9'>开发预览 · 虚拟盘演练</text><rect x='24' y='685.714' width='162' height='44' rx='7' fill='#253F5F' stroke='none' stroke-width='2'/><text x='42' y='712.824' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#FFFFFF'>高级工具 ↗</text><text x='236' y='51' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='25' font-weight='600' fill='#192B43'>正在完成安装演练</text><text x='236' y='79.75' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>保持电脑接通电源，完成前请不要移动工作目录。</text><rect x='236' y='104.75' width='780.286' height='33.24' rx='8' fill='#E7EEF9' stroke='none' stroke-width='0'/><text x='248' y='125.75' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#35547A'>当前使用独立虚拟盘演练。掌机的实际磁盘安装将在实机验收阶段开放。</text><defs><clipPath id='clip0'><rect x='236' y='155.99' width='772.286' height='487.944'/></clipPath></defs><g clip-path='url(#clip0)'><rect x='236' y='155.99' width='772.286' height='238.13' rx='12' fill='#FFFFFF' stroke='#DFE6F0' stroke-width='1'/><text x='259' y='197.99' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='19' font-weight='600' fill='#192B43'>2 / 3 · 写入并核对</text><text x='259' y='227.12' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#61728A'>示例：正在读回核对 rootfs-A</text><rect x='259' y='288.12' width='726.286' height='7' rx='0' fill='#E6E6E6' stroke='#BCBCBC' stroke-width='1'/><defs><clipPath id='clip1'><rect x='259' y='288.12' width='450.297' height='7'/></clipPath></defs><g clip-path='url(#clip1)'></g><text x='259' y='317.12' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#61728A'>当前分区写入与读回：62%</text><text x='259' y='360.12' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#61728A'>可以停止演练。正在写入时，会先结束当前操作并卸载测试盘。</text><text x='236' y='420.12' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='12' font-weight='400' fill='#61728A'>关闭窗口也会先请求停止；清理完成后才能退出。</text></g><rect x='914.286' y='689.714' width='92' height='44' rx='7' fill='#E8EDF4' stroke='none' stroke-width='2'/><text x='932.286' y='716.824' font-family='Microsoft YaHei UI,Microsoft YaHei,sans-serif' font-size='14' font-weight='400' fill='#17243A'>停止演练</text><text x='236' y='779' font-family='Microsoft YaHei,sans-serif' font-size='11' fill='#61728A'>设计预览 · 根据 WPF 布局重建，非原生窗口截图</text></svg>